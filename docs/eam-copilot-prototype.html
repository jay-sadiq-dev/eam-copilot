<title>EAM Copilot Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar (Copilot + results) | main column. Chat is the home screen; results open in the main column. */
:root{
  --bg:#F6F7F9; --side:#EEF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#E0E4E9; --line-strong:#CBD1D8;
  --fg:#0F1419; --muted:#5B6470; --accent:#0B7A69; --accent-fg:#FFFFFF; --accent-soft:#DCF0EB;
  --tag:#F5C443; --tag-fg:#2A2100;
  --ok-bg:#DCF1E5; --ok-fg:#12623B; --warn-bg:#FBEFCF; --warn-fg:#7A4E00;
  --bad-bg:#F9E1DC; --bad-fg:#9A2516; --info-bg:#E2EBF7; --info-fg:#1F4E80;
  --neutral-bg:#E8EBEE; --neutral-fg:#3D4954;
  --bubble:#0F1419; --bubble-fg:#FFFFFF; --shadow:rgba(15,20,25,.08); --shadow-strong:rgba(15,20,25,.16);
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1115; --side:#12171C; --surface:#161C22; --surface-2:#1B2229; --line:#27303A; --line-strong:#36414C;
  --fg:#E7ECF0; --muted:#98A3AE; --accent:#4CC3AE; --accent-fg:#05201A; --accent-soft:#123A32;
  --tag:#F5C443; --tag-fg:#2A2100;
  --ok-bg:#15372A; --ok-fg:#7FD3A6; --warn-bg:#3A2D11; --warn-fg:#F0C46A;
  --bad-bg:#3D1E1A; --bad-fg:#F39A8C; --info-bg:#1A2B3C; --info-fg:#9CC4EE;
  --neutral-bg:#252F38; --neutral-fg:#C3CDD6;
  --bubble:#E7ECF0; --bubble-fg:#0D1115; --shadow:rgba(0,0,0,.3); --shadow-strong:rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1115; --side:#12171C; --surface:#161C22; --surface-2:#1B2229; --line:#27303A; --line-strong:#36414C;
  --fg:#E7ECF0; --muted:#98A3AE; --accent:#4CC3AE; --accent-fg:#05201A; --accent-soft:#123A32;
  --tag:#F5C443; --tag-fg:#2A2100;
  --ok-bg:#15372A; --ok-fg:#7FD3A6; --warn-bg:#3A2D11; --warn-fg:#F0C46A;
  --bad-bg:#3D1E1A; --bad-fg:#F39A8C; --info-bg:#1A2B3C; --info-fg:#9CC4EE;
  --neutral-bg:#252F38; --neutral-fg:#C3CDD6;
  --bubble:#E7ECF0; --bubble-fg:#0D1115; --shadow:rgba(0,0,0,.3); --shadow-strong:rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.strong{font-weight:600}
#app{height:100%}

/* shared bits */
.mark{position:relative;flex:none;width:24px;height:30px;background:var(--tag);color:var(--tag-fg);clip-path:polygon(22% 0,78% 0,100% 20%,100% 100%,0 100%,0 20%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:700 12px/1 var(--mono)}
.mark::before{content:"";position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(0,0,0,.38)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.danger{color:var(--bad-fg);border-color:var(--bad-fg);background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn.block{width:100%;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok-fg)} .t-warn{background:var(--warn-bg);color:var(--warn-fg)}
.t-bad{background:var(--bad-bg);color:var(--bad-fg)} .t-info{background:var(--info-bg);color:var(--info-fg)}
.t-neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
.in{height:42px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea.in{height:auto;padding:10px 12px;resize:vertical}
.lbl{font-size:13px;font-weight:600}
.err{margin:0;color:var(--bad-fg);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px var(--shadow-strong)}
.toast.bad{background:var(--bad-fg);color:var(--surface)}

/* auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 12px 40px var(--shadow);display:flex;flex-direction:column;gap:18px}
.auth-card h1{font-size:22px;letter-spacing:-.015em}
.auth-card .sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--surface-2);border-radius:10px;gap:4px}
.tab{min-height:36px;border:0;border-radius:7px;background:transparent;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px var(--shadow-strong)}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-opt{text-align:left;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.role-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.role-opt span{font-size:12.5px;color:var(--muted)}
.demo{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted);text-align:center}
.demo .row{justify-content:center}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* app shell */
.shell{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:16px 12px;min-height:0;overflow-y:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side .brand{padding:4px 8px 12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.nav-btn:hover{background:var(--surface);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.nav-btn svg{flex:none}
.nav-btn .sp{flex:1}
.cnt{font:500 12px var(--mono);color:var(--muted)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12.5px}
.who{flex:1;min-width:0}
.who-name{font-weight:600;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-role{font-size:12px;color:var(--muted)}
.icon-btn{width:38px;height:38px;flex:none;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}
.icon-btn:hover:not(:disabled){background:var(--surface-2)}
.icon-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow-y:auto;padding-block:28px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .side .brand{padding:0 6px 0 0}
  .side .brand-name,.nav-label,.who,.side-foot .avatar{display:none}
  .nav{flex-direction:row}
  .nav-btn{min-height:36px}
  .nav-btn .sp,.nav-btn .cnt{display:none}
  .side-foot{margin:0 0 0 auto;padding:0;border:0}
}

/* chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.chat-top .t{font-weight:600}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding-block:24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.log-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hero{max-width:760px;margin:6vh auto 0;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.hero h1{font-size:clamp(24px,3.2vw,32px);letter-spacing:-.02em;font-weight:600}
.hero p{color:var(--muted);margin:0;max-width:52ch}
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:700px){.starters{grid-template-columns:1fr}}
.starter{text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px var(--shadow)}
.starter:hover{border-color:var(--accent)}
.starter b{font-weight:600;font-size:14px}
.starter span{font-size:13px;color:var(--muted)}
.msg-u{align-self:flex-end;max-width:80%;background:var(--bubble);color:var(--bubble-fg);padding:10px 14px;border-radius:16px 16px 4px 16px;overflow-wrap:anywhere}
.msg-s{align-self:center;font-size:12.5px;color:var(--muted)}
.msg-a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.ai-av{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 12px var(--mono)}
.msg-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.msg-text{overflow-wrap:anywhere}
.trace{border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px}
.trace summary{cursor:pointer;padding:8px 12px;color:var(--muted);font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
.trace summary::-webkit-details-marker{display:none}
.trace summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.trace[open] summary::before{transform:rotate(45deg)}
.trace ol{margin:0;padding:0 12px 10px;list-style:none;display:flex;flex-direction:column;gap:6px}
.trace li{display:grid;grid-template-columns:16px minmax(0,auto) minmax(0,1fr);gap:8px;align-items:baseline}
.trace li svg{color:var(--ok-fg);align-self:center}
.trace .tool{font-family:var(--mono);font-size:12px;color:var(--fg)}
.trace .res{color:var(--muted)}
@media (max-width:560px){.trace li{grid-template-columns:16px minmax(0,1fr)}.trace .res{grid-column:2}}
.ref{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;width:100%}
.ref:hover{border-color:var(--accent)}
.ref .rt{flex-basis:100%;font-size:13.5px}
.composer{padding:10px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.composer-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px}
.chip:hover:not(:disabled){border-color:var(--accent)}
.box{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);box-shadow:0 4px 16px var(--shadow)}
.box input{flex:1;min-width:0;border:0;background:transparent;height:40px;padding:0 6px;outline:none}
.box:focus-within{border-color:var(--accent)}
.box .icon-btn{border-color:transparent}
.doc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;max-width:100%}
.doc .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots span{display:inline-block;animation:blink 1.1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.7}.trace summary::before{transition:none}}

/* results */
.head h1{font-size:24px;letter-spacing:-.015em}
.head p{color:var(--muted);margin:4px 0 0;max-width:62ch}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:86px minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.item .chev{color:var(--muted)}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr) auto}.item .mono,.item .chev{display:none}}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.ids{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.by{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 12px;border-radius:8px;font-size:13.5px}
.banner.bad{background:var(--bad-bg);color:var(--bad-fg)} .banner.warn{background:var(--warn-bg);color:var(--warn-fg)} .banner.info{background:var(--info-bg);color:var(--info-fg)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;min-width:620px;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--ok-fg)}
.bar.low i{background:var(--warn-fg)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chk{display:grid;grid-template-columns:22px 140px minmax(0,1fr);gap:4px 10px;padding:7px 10px;border-radius:8px;font-size:13.5px;align-items:start}
.chk-i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%}
.r-pass .chk-i{background:var(--ok-bg);color:var(--ok-fg)}
.r-warn .chk-i{background:var(--warn-bg);color:var(--warn-fg)}
.r-fail .chk-i{background:var(--bad-bg);color:var(--bad-fg)}
.r-fail{background:var(--bad-bg)}
.r-fail .chk-d{color:var(--bad-fg)}
.chk-l{font-weight:600}
.chk-d{color:var(--muted)}
@media (max-width:560px){.chk{grid-template-columns:22px minmax(0,1fr)}.chk-d{grid-column:2}}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.pair button{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-family:var(--mono);font-size:13.5px}
.pair button:hover{text-decoration:underline}
.checker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:700px){.checker{grid-template-columns:1fr}}
.back{align-self:flex-start}
.reason{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}

/* admin approvals */
.greet h1{font-size:26px;letter-spacing:-.02em}
.greet p{color:var(--muted);margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px var(--shadow)}
.stat .n{font:600 30px/1.1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.warn .n{color:var(--warn-fg)} .stat.ok .n{color:var(--ok-fg)} .stat.bad .n{color:var(--bad-fg)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 18px var(--shadow)}
.qcard h3{font-size:16px;letter-spacing:-.01em}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.notes li{display:flex;gap:8px;align-items:flex-start}
.notes .i{flex:none;margin-top:2px}
.all-clear{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.all-clear .ic{width:44px;height:44px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:grid;place-items:center}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';
const KEY='eam-copilot-proto-v1';

/* ---------- the matching rules (this is the logic worth testing) ---------- */
function evaluate(s,tpId,pmId){
  const tp=s.tps.find(r=>r.id===tpId), pm=s.pms.find(r=>r.id===pmId), checks=[];
  const notOk=[tp,pm].filter(r=>r.status!=='approved');
  checks.push({label:'Both approved',result:notOk.length?'fail':'pass',detail:notOk.length?notOk.map(r=>r.id+' is '+lbl(r.status).toLowerCase()).join(', ')+'. An admin must approve both first.':'An admin approved both documents.'});
  const same=tp.asset===pm.asset;
  checks.push({label:'Same asset',result:same?'pass':'fail',detail:same?'Both cover '+tp.assetName+'.':'Task plan is for '+tp.assetName+', PM schedule is for '+pm.assetName+'.'});
  const nums=new Set(tp.tasks.map(k=>k.n)), refs=[...new Set(pm.lines.flatMap(l=>l.tasks))], missing=refs.filter(n=>!nums.has(n));
  checks.push({label:'Tasks exist',result:missing.length?'fail':'pass',detail:missing.length?'PM calls '+range(missing)+', which '+(missing.length>1?'are':'is')+' not in '+tp.id+'.':'Every PM line calls a real task in '+tp.id+'.'});
  const covered=tp.tasks.filter(k=>refs.includes(k.n)).length, total=tp.tasks.length, ratio=total?covered/total:0;
  checks.push({label:'All tasks scheduled',result:ratio===1?'pass':ratio>=0.5?'warn':'fail',detail:covered+' of '+total+' tasks are on a PM line.'+(ratio<1?' The rest would never reach a work order.':'')});
  let score=Math.round(100*(0.55+0.45*ratio));
  if(!same) score=Math.min(score,22);
  if(missing.length) score=Math.min(score,35);
  return {ok:!checks.some(c=>c.result==='fail'),checks,score,covered,total};
}

/* ---------- operations: chat and buttons both go through these ---------- */
function opSubmit(r){
  if(r.status!=='draft'&&r.status!=='rejected') return {ok:false,msg:r.id+' is '+lbl(r.status).toLowerCase()+'.'};
  const k=r.kind==='tp'&&r.tasks.find(needsReview);
  if(k) return {ok:false,task:k,msg:r.id+' is on hold: task '+k.n+' is only '+pct(k.conf)+' confident. Confirm it first.'};
  r.status='submitted'; r.note=''; r.when=now(); return {ok:true};
}
function opApprove(r){if(r.status!=='submitted') return {ok:false,msg:r.id+' is not waiting for approval.'}; r.status='approved'; r.when=now(); return {ok:true};}
function opReject(r,reason){if(r.status!=='submitted') return {ok:false,msg:r.id+' is not waiting for approval.'}; r.status='rejected'; r.note=reason; r.when=now(); return {ok:true};}
function opConfirmTask(r,n){const k=r.tasks.find(x=>x.n===n); if(k) k.reviewed=true; return !!k;}
function opCheck(tpId,pmId){
  const live=S.links.find(l=>l.tp===tpId&&l.pm===pmId&&l.status!=='failed'); if(live) return {dupe:live};
  const ev=evaluate(S,tpId,pmId); let link=S.links.find(l=>l.tp===tpId&&l.pm===pmId);
  if(link) Object.assign(link,{status:ev.ok?'proposed':'failed',score:ev.score,checks:ev.checks,by:me().name,when:now()});
  else {link={id:'TPPM-'+pad(S.seq.link++),tp:tpId,pm:pmId,status:ev.ok?'proposed':'failed',score:ev.score,checks:ev.checks,by:me().name,when:now()}; S.links.unshift(link);}
  return {link,ev};
}
function opConfirmLink(l){
  if(l.status!=='proposed') return {ok:false,msg:l.id+' is not waiting for confirmation.'};
  const ev=evaluate(S,l.tp,l.pm); if(!ev.ok){Object.assign(l,{status:'failed',checks:ev.checks,score:ev.score}); return {ok:false,msg:l.id+' no longer passes its checks.'};}

}

function firstReview(){for(const r of S.tps){if(r.status!=='draft'&&r.status!=='rejected') continue; const k=r.tasks.find(needsReview); if(k) return {r,k};} return null;}
const readyToSubmit=()=>all().filter(r=>(r.status==='draft'||r.status==='rejected')&&!(r.kind==='tp'&&r.tasks.some(needsReview)));
function eligiblePairs(){const o=[]; S.tps.forEach(tp=>S.pms.forEach(pm=>{if(tp.status==='approved'&&pm.status==='approved'&&tp.asset===pm.asset&&!S.links.some(l=>l.tp===tp.id&&l.pm===pm.id&&l.status!=='failed')) o.push([tp.id,pm.id]);})); return o;}
function parseIds(raw){const o=[]; const re=/\b(tppm|tp|pm)[-\s]?(\d{1,4})\b/gi; let m; while((m=re.exec(raw))) o.push(m[1].toUpperCase()+'-'+pad(m[2])); return o;}

/* ---------- Copilot (scripted agent) ---------- */
const chat=()=>{if(!S.chat[S.session]) S.chat[S.session]=[]; return S.chat[S.session];};
function ai(text,x){chat().push(Object.assign({from:'ai',text},x||{}));}
function say(text){
  if(!text||S.ui.thinking) return;
  chat().push({from:'user',text}); S.ui.thinking=true; S.ui.draft=''; S.view='chat'; S.detail=null; render();
  setTimeout(()=>{try{respond(text);}catch(e){ai('Something went wrong on my side. You can do the same step by hand from the sidebar.');} S.ui.thinking=false; render();},700);
}
function respond(raw){
  const t=raw.toLowerCase(), ids=parseIds(raw), has=(...w)=>w.some(x=>t.includes(x));
  if(isAdmin()){
    if(has('reject','send back')) return aReject(raw,ids);
    if(has('approve')) return aApprove(ids,t);
    if(has('waiting','pending','queue','review','what','status','summar')) return aQueue();
    return ai('I summarise what consultants submit, and approve or reject when you tell me to. Try "What is waiting for me?"');
  }
  if(has('sample','attach','upload')&&!has('extract')) return cAttach();
  if(/confirm/.test(t)&&/assoc|link|tppm/.test(t)) return cConfirmLink(ids);
  if(/confirm/.test(t)&&/task/.test(t)) return cConfirmTask(t,ids);
  if(has('extract','pull','read the')) return cExtract(t);
  if(has('submit','send for approval')) return cSubmit(ids);
  if(has('associate','link','match','tppm','map')) return cAssociate(ids);
  if(has('approve','reject')) return ai('Only an admin can approve or reject. Sign out and sign in as an admin to see that side.');
  if(has('status','waiting','where','what')) return cStatus();
  return ai('I can read a maintenance manual, draft the task plan and PM schedule, submit them for approval, and link approved pairs. Try one of the suggestions below.');
}
function cAttach(){
  if(!S.docs.some(d=>d.name===SAMPLE_DOC)) S.docs.unshift({name:SAMPLE_DOC,size:'48 pages'});

}
function attachFile(f){
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast(f.name+' is not a PDF.',true); return;}
  const size=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB';
  S.docs.unshift({name:f.name,size}); chat().push({from:'user',text:'Attached '+f.name});
  ai('Got '+f.name+'. Prototype note: whatever PDF you attach, extraction returns the sample P-101 pump plan. Should I draft both documents?',{trace:[['read_pdf',f.name+', '+size]],actions:['Extract both','Extract the task plan only']});
}
function cExtract(t){
  let wTP=/task[\s-]?plan|\btp\b/.test(t), wPM=/schedule|\bpm\b/.test(t);
  if(/both|everything|\ball\b/.test(t)||(!wTP&&!wPM)){wTP=true; wPM=true;}
  if(/only/.test(t)&&/task/.test(t)) wPM=false;
  if(!S.docs.length) return ai('Attach a manual first, or use the sample one.',{actions:['Use the sample P-101 manual']});
  const doc=S.docs[0].name, made=[], trace=[], parts=[];
  if(wTP&&!S.extracted.tp){const id=extractTP(doc); made.push(id); trace.push(['extract_tasks','6 tasks with trade, time and page'],['score_confidence','task 6 at 62% (scanned table)'],['save_draft',id]); parts.push(id+' has 6 tasks. I am unsure about task 6 (impeller wear ring clearance, page 41) because that table is a scanned image. Please check it before submitting.');}
  if(wPM&&!S.extracted.pm){const id=extractPM(doc); made.push(id); trace.push(['extract_intervals','quarterly and annual'],['map_lines_to_tasks','A → tasks 1–4, B → tasks 5–6'],['save_draft',id]); parts.push(id+' has a quarterly inspection (tasks 1 to 4) and an annual overhaul (tasks 5 and 6).');}
  if(!made.length) return ai('I already drafted '+listIds([S.extracted.tp,S.extracted.pm].filter(Boolean))+' from this manual.',{refs:[S.extracted.tp,S.extracted.pm].filter(Boolean)});
  const fr=firstReview();
  ai('Done. '+parts.join('\n\n'),{trace,refs:made,actions:fr?['Confirm task '+fr.k.n+' on '+fr.r.id]:[]});
}
function cConfirmTask(t,ids){
  const m=t.match(/task\s*(\d+)/); let hit=null;
  for(const r of S.tps){if(ids.length&&!ids.includes(r.id)) continue; const k=r.tasks.find(x=>needsReview(x)&&(!m||x.n===+m[1])); if(k&&(r.status==='draft'||r.status==='rejected')){hit={r,k};break;}}
  if(!hit) return ai('Nothing like that is waiting for your check.');
  opConfirmTask(hit.r,hit.k.n);
  const ready=readyToSubmit().map(r=>r.id);
  ai('Marked task '+hit.k.n+' on '+hit.r.id+' as checked by you.'+(ready.length?' '+listIds(ready)+(ready.length>1?' are':' is')+' ready to submit.':''),{trace:[['mark_reviewed',hit.r.id+' task '+hit.k.n]],actions:ready.length?['Submit '+listIds(ready)+' for approval']:[]});
}
function cSubmit(ids){
  const recs=ids.length?ids.map(findAny).filter(Boolean):all().filter(r=>r.status==='draft'||r.status==='rejected');
  if(!recs.length) return ai('Nothing is ready to submit yet.');
  const ok=[],msgs=[],trace=[]; let held=null;
  recs.forEach(r=>{const x=opSubmit(r); trace.push(['submit_for_approval',r.id+(x.ok?' → awaiting approval':' → blocked')]); if(x.ok) ok.push(r.id); else {msgs.push(x.msg); if(x.task) held={r,k:x.task};}});
  ai([ok.length?'Submitted '+listIds(ok)+'. An admin will review '+(ok.length>1?'them':'it')+' next.':'',msgs.join('\n')].filter(Boolean).join('\n\n'),{trace,refs:ok,actions:held?['Confirm task '+held.k.n+' on '+held.r.id]:[]});
}
function cAssociate(ids){
  let tpId=ids.find(i=>i.startsWith('TP-')), pmId=ids.find(i=>i.startsWith('PM-'));
  if(tpId&&!findTP(tpId)) return ai('I cannot find '+tpId+'.');
  if(pmId&&!findPM(pmId)) return ai('I cannot find '+pmId+'.');
  if(tpId&&!pmId){const c=S.pms.find(p=>p.asset===findTP(tpId).asset); if(c) pmId=c.id;}
  if(!tpId||!pmId){const p=eligiblePairs()[0]; if(!p) return ai('There is no approved pair waiting to be linked. Documents need admin approval before I can link them.'); tpId=p[0]; pmId=p[1];}
  const res=opCheck(tpId,pmId);
  if(res.dupe) return ai(tpId+' and '+pmId+' are already in '+res.dupe.id+'.',{refs:[res.dupe.id]});
  const {link,ev}=res, tp=findTP(tpId), trace=[['run_match_check',tpId+' × '+pmId+' → '+ev.checks.filter(c=>c.result!=='fail').length+' of '+ev.checks.length+' checks pass']];
  S.ui.highlight=link.id;
  if(ev.ok){trace.push(['propose_link',link.id+', waiting for you']); return ai('These match ('+ev.score+'%). Same asset, every PM line calls a real task, and all '+ev.total+' tasks are scheduled. I have proposed '+link.id+'. It only takes effect when you confirm it.',{trace,refs:[link.id],actions:['Confirm association '+link.id]});}
  const fails=ev.checks.filter(c=>c.result==='fail');
  let next='';
  if(fails.some(c=>c.label==='Same asset')){const alt=S.pms.find(p=>p.asset===tp.asset); trace.push(['find_alternative','searched '+S.pms.length+' PM schedules for '+tp.asset+' → '+(alt?alt.id:'none')]); next=alt?'Try '+alt.id+' instead, it covers the same asset.':'No PM schedule exists for '+tp.assetName+' yet. Draft one from its manual first.';}
  else if(fails.some(c=>c.label==='Both approved')) next='Ask an admin to approve them, then ask me again. I will re-run the check on the same record.';
  trace.push(['record_failure',link.id]);
  ai('I could not link '+tpId+' with '+pmId+'. I saved it as failed association '+link.id+' so you can see why:\n'+fails.map(c=>'• '+c.detail).join('\n')+(next?'\n\n'+next:''),{trace,refs:[link.id]});
}
function cConfirmLink(ids){
  const l=(ids.length&&findLink(ids.find(i=>i.startsWith('TPPM'))))||S.links.find(x=>x.status==='proposed');
  if(!l) return ai('No association is waiting for your confirmation.');
  const r=opConfirmLink(l); if(!r.ok) return ai(r.msg,{refs:[l.id]});
  ai(l.tp+' and '+l.pm+' are now linked. Each PM line knows which tasks go on its work order.',{trace:[['confirm_link',l.id+' (on your instruction)']],refs:[l.id]});

  if(r.kind==='tp') r.tasks.filter(k=>k.conf<0.75).forEach(k=>{s+=' Task '+k.n+' was '+pct(k.conf)+' confident; '+r.owner+' checked it.';});

function aQueue(){

}
function aApprove(ids,t){
  const p=pending(); const recs=ids.length?ids.map(findAny).filter(Boolean):(/all|everything|pending|both/.test(t)||p.length===1)?p:[];
  if(!recs.length) return ai(p.length?'Which one? '+listIds(p.map(r=>r.id))+' are waiting.':'Nothing is waiting for approval.');
  const ok=[],no=[]; recs.forEach(r=>{const x=opApprove(r); x.ok?ok.push(r.id):no.push(x.msg);});
  let txt=ok.length?'Approved '+listIds(ok)+'.':''; if(no.length) txt+=(txt?'\n':'')+no.join('\n');
  const pairs=eligiblePairs().filter(pr=>ok.includes(pr[0])||ok.includes(pr[1])); if(pairs.length) txt+='\n\n'+pairs.map(pr=>pr[0]+' and '+pr[1]).join(', ')+' can now be linked by the consultant.';
  ai(txt,{trace:ok.map(id=>['approve',id+' (on your instruction)']),refs:ok});
}
function aReject(raw,ids){
  const p=pending(); const recs=ids.length?ids.map(findAny).filter(Boolean):(p.length===1?p:[]);
  if(!recs.length) return ai(p.length?'Which one should I send back? For example: Reject '+p[0].id+', torque values missing.':'Nothing is waiting for approval.');
  const st=raw.replace(/\b(tppm|tp|pm)[-\s]?\d{1,4}\b/gi,''), m=st.match(/(?:,|:|\bbecause\b)\s*(.+)$/i), reason=m?m[1].trim().replace(/\.+$/,''):'';
  if(!reason) return ai('Add a reason so the consultant knows what to fix. For example: Reject '+recs[0].id+', torque values missing.');
  const ok=[]; recs.forEach(r=>{if(opReject(r,reason).ok) ok.push(r.id);});
  ai(ok.length?'Sent '+listIds(ok)+' back with your reason: '+reason+'.':'Those are not waiting for approval.',{trace:ok.map(id=>['reject',id+' (on your instruction)']),refs:ok});
}
function suggestions(){
  if(isAdmin()){const p=pending(); return p.length?['What is waiting for me?',p.length>1?'Approve everything pending':'Approve '+p[0].id,'Reject '+p[0].id+', torque values missing']:['What is waiting for me?'];}
  const o=[];
  if(!S.docs.length) o.push('Use the sample P-101 manual');
  else if(!S.extracted.tp||!S.extracted.pm) o.push('Extract both');
  const fr=firstReview(); if(fr) o.push('Confirm task '+fr.k.n+' on '+fr.r.id);
  const ready=readyToSubmit(); if(ready.length) o.push('Submit '+listIds(ready.map(r=>r.id))+' for approval');
  const pr=S.links.find(l=>l.status==='proposed'); if(pr) o.push('Confirm association '+pr.id);
  const ep=eligiblePairs()[0]; if(ep) o.push('Associate '+ep[0]+' with '+ep[1]);
  if(o.length<3) o.push('Associate TP-0036 with PM-0011');
  if(o.length<3) o.push('What is the status?');
  return o.slice(0,4);
}

  };
  return '<div class="greet"><h1>'+part+', '+esc(first)+'</h1><p>'+(p.length?p.length+' document'+(p.length>1?'s are':' is')+' waiting for your decision.':'You are all caught up.')+'</p></div>'+
  '<div class="stats"><div class="stat warn"><span class="n">'+p.length+'</span><span class="l">Waiting</span></div><div class="stat ok"><span class="n">'+all().filter(r=>r.status==='approved').length+'</span><span class="l">Approved</span></div><div class="stat"><span class="n">'+S.links.filter(l=>l.status==='active').length+'</span><span class="l">Linked pairs</span></div><div class="stat bad"><span class="n">'+S.links.filter(l=>l.status==='failed').length+'</span><span class="l">Failed links</span></div></div>'+
  (p.length?p.map(q).join(''):'<div class="all-clear"><span class="ic">'+icon('check',22)+'</span><strong>Nothing to approve</strong><span class="muted">New submissions from consultants will appear here.</span></div>');
}
function appHTML(){
  let main;
  if(S.view==='chat') main=chatHTML();
  else {
    let inner;
    if(S.view==='approvals'&&isAdmin()) inner=approvalsHTML();
    else if(S.view==='tps') inner=S.detail&&findTP(S.detail)?detailHTML(findTP(S.detail)):listHTML('tp');
    else if(S.view==='pms') inner=S.detail&&findPM(S.detail)?detailHTML(findPM(S.detail)):listHTML('pm');
    else inner=linksHTML();
    main='<div class="page" id="page"><div class="wrap">'+inner+'</div></div>';
  }
  return '<div class="shell">'+sideHTML()+'<main class="main">'+main+'</main></div><input type="file" id="pdf-input" accept=".pdf,application/pdf" hidden>'+(toastMsg?'<div class="toast'+(toastMsg.bad?' bad':'')+'" role="status">'+esc(toastMsg.text)+'</div>':'');
}

/* ---------- render + events ---------- */
function render(){
  const a=document.activeElement, fid=a&&a.id; let sel=null; try{if(fid&&a.setSelectionRange) sel=[a.selectionStart,a.selectionEnd];}catch(e){}
  const pg=document.getElementById('page'), top=pg?pg.scrollTop:0;
  document.getElementById('app').innerHTML=S.session&&me()?appHTML():authHTML();
  const pg2=document.getElementById('page'); if(pg2) pg2.scrollTop=resetScroll?0:top;
  if(resetScroll&&S.ui.highlight&&S.view==='links'){const c=document.getElementById('card-'+S.ui.highlight); if(c) c.scrollIntoView({block:'nearest'});}
  resetScroll=false;
  const log=document.getElementById('chatlog'); if(log) log.scrollTop=log.scrollHeight;
  const f=focusId||fid; focusId=null;
  if(f){const el=document.getElementById(f); if(el){try{el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  save();
}
function signIn(u){S.session=u.id; S.view=u.role==='admin'?'approvals':'chat'; S.detail=null; S.ui.authErr=''; S.ui.reason=null; S.ui.draft=''; resetScroll=true;}
function submitAuth(){
  const up=S.ui.auth==='signup', v=id=>{const el=document.getElementById(id); return el?el.value:'';};
  const name=v('f-name').trim(), email=v('f-email').trim(), pass=v('f-pass');
  S.ui.authEmail=email; S.ui.authName=name; S.ui.authErr='';
  if(up){
    if(!name) S.ui.authErr='Enter your full name.';
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) S.ui.authErr='Enter a valid email address.';
    else if(pass.length<6) S.ui.authErr='Use a password of at least 6 characters.';
    else if(S.users.some(u=>u.email.toLowerCase()===email.toLowerCase())) S.ui.authErr='An account with this email already exists. Sign in instead.';
    else {const u={id:'u-'+Date.now(),name,email,password:pass,role:S.ui.authRole}; S.users.push(u); signIn(u); S.ui.authName=''; S.ui.authEmail=''; toast('Account created. Welcome, '+name.split(' ')[0]+'.');}
  } else {
    const u=S.users.find(x=>x.email.toLowerCase()===email.toLowerCase());
    if(!email||!pass) S.ui.authErr='Enter your email and password.';
    else if(!u) S.ui.authErr='No account with that email. Sign up, or use a demo account below.';
    else if(u.password!==pass) S.ui.authErr='Wrong password. The demo accounts use demo123.';
    else {signIn(u); S.ui.authEmail='';}
  }
  render();
}
function openItem(id){
  S.ui.reason=null; resetScroll=true;
  if(id.startsWith('TPPM')){S.view='links'; S.detail=null; S.ui.highlight=id;}
  else if(id.startsWith('TP')){S.view='tps'; S.detail=id;}
  else {S.view='pms'; S.detail=id;}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const d=b.dataset, r=d.id?findAny(d.id):null, l=d.id?findLink(d.id):null;
  switch(d.act){
    case 'auth-mode': S.ui.auth=d.mode; S.ui.authErr=''; break;
    case 'auth-role': S.ui.authRole=d.role; break;
    case 'demo': signIn(S.users.find(u=>u.id===d.id)); break;
    case 'logout': S.session=null; S.ui.auth='signin'; S.ui.thinking=false; break;
    case 'nav': S.view=d.view; S.detail=null; S.ui.reason=null; S.ui.highlight=null; resetScroll=true; break;
    case 'open': openItem(d.id); break;
    case 'say': say(d.say); return;
    case 'new-chat': S.chat[S.session]=[]; break;
    case 'attach': {const f=document.getElementById('pdf-input'); if(f) f.click(); return;}
    case 'submit': {const x=opSubmit(r); toast(x.ok?'Submitted '+r.id+' for approval.':x.msg,!x.ok); break;}
    case 'approve': {const x=opApprove(r); toast(x.ok?'Approved '+r.id+'.':x.msg,!x.ok); S.ui.reason=null; break;}
    case 'reject': S.ui.reason=d.id; S.ui.reasonText=''; S.ui.reasonErr=''; focusId='reason-text'; break;
    case 'reason-cancel': S.ui.reason=null; break;
    case 'reason-ok': {const txt=S.ui.reasonText.trim(); if(!txt){S.ui.reasonErr='Add a reason so the consultant knows what to fix.'; focusId='reason-text'; break;} opReject(r,txt); S.ui.reason=null; toast('Sent '+r.id+' back to '+r.owner.split(' ')[0]+'.'); break;}
    case 'confirm-task': opConfirmTask(r,+d.n); toast('Task '+d.n+' marked as checked.'); break;
    case 'check': {const x=opCheck(S.ui.pickTP,S.ui.pickPM); if(x.dupe){S.ui.highlight=x.dupe.id; toast('Already associated in '+x.dupe.id+'.',true);} else {S.ui.highlight=x.link.id; toast(x.ev.ok?'All checks passed. Confirm '+x.link.id+' to link them.':'Checks failed. Saved as '+x.link.id+'.',!x.ev.ok);} resetScroll=true; break;}
    case 'recheck': {const x=opCheck(l.tp,l.pm); S.ui.highlight=l.id; toast(x.ev&&x.ev.ok?'Checks pass now. Confirm '+l.id+'.':'Still failing.',!(x.ev&&x.ev.ok)); break;}
    case 'confirm-link': {const x=opConfirmLink(l); toast(x.ok?l.tp+' and '+l.pm+' are linked.':x.msg,!x.ok); break;}
    case 'discard-link': S.links=S.links.filter(x=>x!==l); toast('Discarded '+l.id+'.'); break;
    default: return;
  }
  render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='auth-form') submitAuth();
  if(e.target.id==='chat-form'){const v=(document.getElementById('chat-text').value||'').trim(); if(v) say(v);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='chat-text') S.ui.draft=e.target.value;
  if(e.target.id==='reason-text') S.ui.reasonText=e.target.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pick-tp') S.ui.pickTP=el.value;
  if(el.id==='pick-pm') S.ui.pickPM=el.value;
  if(el.id==='pdf-input'&&el.files&&el.files[0]){attachFile(el.files[0]); S.view='chat'; S.detail=null; render(); return;}
  save();
});
render();
})();
</script>
